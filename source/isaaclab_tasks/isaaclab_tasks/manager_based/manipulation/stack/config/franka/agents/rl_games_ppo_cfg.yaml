params:
  seed: 42

  # environment wrapper clipping
  env:
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None

        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0.3
        fixed_sigma: False
    mlp:
      units: [512, 128, 64]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 512
      layers: 1
      before_mlp: True
      concat_input: True
      layer_norm: True

  load_checkpoint: False # flag which sets whether to load the checkpoint
  load_path: '' # path to the checkpoint to load

  config:
    name: franka_stack
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.995
    tau: 0.95
    learning_rate: 5.0e-5
    lr_schedule: fixed
    schedule_type: standard
    kl_threshold: 0.008
    score_to_win: 200000000
    max_epochs: 200000
    save_best_after: 5
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.001
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 128
    minibatch_size: 2048  # 16 recurrent sequences per minibatch with seq_length=128
    mini_epochs: 3
    critic_coef: 0.5
    clip_value: True
    seq_length: 128
    bounds_loss_coef: 0.0001
    player:
      deterministic: False
